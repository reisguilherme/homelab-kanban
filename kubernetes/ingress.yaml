apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: hub-only
  namespace: spoke-kanban
spec:
  ipAllowList:
    sourceRange:
      - 172.28.64.100/32
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanban
  namespace: spoke-kanban
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: spoke-kanban-hub-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: kanban.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanban-kaneo
                port:
                  number: 5173
