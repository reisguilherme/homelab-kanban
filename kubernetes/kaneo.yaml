apiVersion: apps/v1
kind: Deployment
metadata:
  name: kanban-kaneo
  namespace: spoke-kanban
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kanban-kaneo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kanban-kaneo
        app.kubernetes.io/part-of: spoke-kanban
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        homelab.greis.dev.br/tier: auxiliary
      tolerations:
        - key: homelab.greis.dev.br/tier
          operator: Equal
          value: auxiliary
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      containers:
        - name: kaneo
          image: ghcr.io/usekaneo/kaneo:2.50.0@sha256:03ad082e33945b9c091266af60c7c88865cb2fab37ff33d91cbbcab626b0094d
          ports:
            - name: http
              containerPort: 5173
          env:
            - name: KANEO_CLIENT_URL
              value: https://kanban.greis.dev.br
            - name: KANEO_CLOUD
              value: "false"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: DATABASE_URL
            - name: AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: kanban-secrets
                  key: AUTH_SECRET
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kanban-kaneo
  namespace: spoke-kanban
spec:
  selector:
    app.kubernetes.io/name: kanban-kaneo
  ports:
    - name: http
      port: 5173
      targetPort: http
