apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanban-postgres-data
  namespace: spoke-kanban
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kanban-postgres-backups
  namespace: spoke-kanban
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
