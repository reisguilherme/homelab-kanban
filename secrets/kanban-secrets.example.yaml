apiVersion: v1
kind: Secret
metadata:
  name: kanban-secrets
  namespace: spoke-kanban
type: Opaque
stringData:
  POSTGRES_USER: "kaneo"
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_POSTGRES_PASSWORD"
  POSTGRES_DB: "kaneo"
  DATABASE_URL: "postgresql://kaneo:REPLACE_WITH_STRONG_POSTGRES_PASSWORD@kanban-postgres:5432/kaneo"
  AUTH_SECRET: "REPLACE_WITH_32_BYTE_HEX_SECRET"
  KANEO_API_KEY: "REPLACE_WITH_KANEO_SERVICE_API_KEY"
  KANBAN_MCP_TOKENS_JSON: '{"REPLACE_WITH_PERSONAL_MCP_TOKEN":{"profile":"sdd-personal","domainId":"personal","allowedWorkspaceId":"REPLACE_WITH_PERSONAL_WORKSPACE_ID","allowedProjects":["*"]},"REPLACE_WITH_WORK_MCP_TOKEN":{"profile":"sdd-work-acme","domainId":"work-acme","allowedWorkspaceId":"REPLACE_WITH_ACME_WORKSPACE_ID","allowedProjects":["REPLACE_WITH_ACME_PROJECT_ID"]}}'
